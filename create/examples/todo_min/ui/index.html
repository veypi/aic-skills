<!DOCTYPE html>
<html>
<head>
  <title>待办清单</title>
  <style>
    /* 样式规范：页面底色/字体由 OS 统一提供（body 只写布局）；颜色用平台设计 token——见 create/references/ui-component.md「样式」节 */
    body { height: 100%; display: flex; flex-direction: column; container-type: inline-size; }
    .bar { display: flex; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border-color); }
    .bar input, .bar select { padding: 6px 10px; border-radius: var(--radius-lg); border: 1px solid var(--border-color); background: var(--bg-color-secondary); color: var(--text-color); }
    .bar input { flex: 1; min-width: 0; }
    .bar select { flex: 0 0 84px; }
    .bar button { padding: 6px 14px; border-radius: var(--radius-lg); border: 1px solid transparent; background: var(--color-primary); color: var(--color-primary-text); cursor: pointer; transition: background var(--transition-fast); }
    .bar button:hover { background: var(--color-primary-hover); }
    .list { flex: 1; overflow: auto; padding: 10px 12px; }
    .item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--border-color); border-radius: var(--radius-lg); margin-bottom: 8px; background: var(--bg-color-secondary); }
    .item.done .title { text-decoration: line-through; opacity: .45; }
    .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item input[type="checkbox"] { accent-color: var(--color-primary); }
    .pri { font-size: var(--font-size-xs); padding: 1px 8px; border-radius: var(--radius-full); background: color-mix(in srgb, var(--color-primary) 14%, transparent); color: var(--color-primary); white-space: nowrap; }
    .del { border: 0; background: none; color: var(--text-color-tertiary); cursor: pointer; }
    .del:hover { color: var(--color-danger); }
    .empty { text-align: center; color: var(--text-color-tertiary); padding: 36px 0; }
    .foot { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-top: 1px solid var(--border-color); font-size: var(--font-size-xs); color: var(--text-color-secondary); }
    .foot button { padding: 5px 12px; border-radius: var(--radius-lg); border: 1px solid var(--border-color); background: var(--bg-color-tertiary); color: var(--text-color); cursor: pointer; }
    .foot button:hover { border-color: var(--border-color-hover); }
    /* 窗口变窄时收起次要元素（@container = 按窗口宽度；不要用 @media） */
    @container (max-width: 560px) {
      .bar select { display: none; }
      .pri { display: none; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <input v:value="draft" @keyup.enter="add()" placeholder="要做什么？（回车添加）" />
    <select v:value="priority">
      <option value="0">普通</option>
      <option value="1">重要</option>
      <option value="2">紧急</option>
    </select>
    <button @click="add()">添加</button>
  </div>
  <div class="list">
    <div v-if="!items.length" class="empty">暂无待办</div>
    <div v-for="item in items" class="item" :class="{ done: item.done }">
      <input type="checkbox" :checked="item.done" @change="toggle(item)" />
      <span class="title">{{ item.title }}</span>
      <span v-if="item.priority > 0" class="pri">{{ priorityLabel(item.priority) }}</span>
      <button class="del" @click="remove(item)">删除</button>
    </div>
  </div>
  <div class="foot">
    <span>{{ doneCount() }} / {{ items.length }} 已完成</span>
    <button @click="clearDone()">清除已完成</button>
  </div>

  <script setup>
    // ===== $data =====
    items = []
    draft = ''
    priority = '0'

    // 页面展示助手
    priorityLabel = (p) => ['普通', '重要', '紧急'][Number(p)] || '普通'
    doneCount = () => items.filter((it) => it.done).length
    genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8)

    // ===== 数据读写（$mod.$fetch：相对路径自动加包前缀） =====
    load = async () => {
      const r = await $mod.$fetch('api/todos')
      items = r.rows || []
    }

    add = async (title, pri) => {
      const t = (title == null ? draft : String(title)).trim()
      if (!t) return null
      const id = genId()
      await $mod.$fetch('api/todo_add', {
        method: 'POST',
        body: {
          id: id, title: t,
          priority: String(pri == null ? priority : pri),
          note: '', created_at: new Date().toISOString(),
        },
      })
      if (title == null) draft = ''
      await load()
      return id
    }

    toggle = async (item, done) => {
      const v = done == null ? (item.done ? 0 : 1) : Number(done)
      await $mod.$fetch('api/todo_toggle', { method: 'POST', body: { id: item.id, done: v } })
      await load()
    }

    remove = async (item) => {
      await $mod.$fetch('api/todo_remove', { method: 'POST', body: { id: item.id } })
      await load()
    }

    clearDone = async () => {
      await $mod.$fetch('api/todo_clear_done', { method: 'POST', body: {} })
      await load()
    }

    // ===== pageDesc：AI 在 page exec JS 中经 win(id).command(data) 调用 =====
    pageDesc = {
      desc: '待办清单页面（todo_min 示例）',
      commands: [
        {
          name: 'todo_status', desc: '待办统计', help: 'win(id).todo_status()；返回 {ok, total, done}',
          handler: async () => { await load(); return { ok: true, total: items.length, done: doneCount() } },
        },
        {
          name: 'todo_add', desc: '新增待办', help: 'win(id).todo_add({title, priority?})',
          handler: async (data) => {
            const title = String(data?.title || '').trim()
            if (!title) throw new Error('todo_add: title required')
            const id = await add(title, data?.priority)
            if (!id) throw new Error('todo_add: empty title')
            return { ok: true, id }
          },
        },
        {
          name: 'todo_toggle', desc: '切换/设置完成状态', help: 'win(id).todo_toggle({id, done?})；done 缺省时翻转',
          handler: async (data) => {
            const item = items.find((it) => it.id === data?.id)
            if (!item) throw new Error('todo_toggle: not found: ' + data?.id)
            await toggle(item, data?.done)
            return { ok: true }
          },
        },
        {
          name: 'todo_remove', desc: '删除待办', help: 'win(id).todo_remove({id})',
          handler: async (data) => {
            const item = items.find((it) => it.id === data?.id)
            if (!item) throw new Error('todo_remove: not found: ' + data?.id)
            await remove(item)
            return { ok: true }
          },
        },
        {
          name: 'todo_clear_done', desc: '清除全部已完成', help: 'win(id).todo_clear_done()',
          handler: async () => { await clearDone(); return { ok: true, total: items.length } },
        },
      ],
    }
  </script>

  <script>
    // 挂载完成后加载数据（跨块共享走 $data：load 是 setup 里的裸赋值）
    load()
  </script>
</body>
</html>
