<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校样编辑</title><style>html,body{width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:#24231f;font:12px Arial,sans-serif}.head{height:58px;display:flex;align-items:center;padding:0 25px;border-bottom:1px solid #c9c5bb}.brand{font:27px Georgia,serif;letter-spacing:-1px}.doc{margin-left:18px;font:17px Georgia,serif}.nav{margin-left:auto;color:#777268}.room{display:grid;grid-template-columns:125px 1fr;height:calc(100vh - 58px)}.index{padding:20px 14px;border-right:1px solid #c9c5bb}.item{padding:12px 4px;border-bottom:1px solid #d6d2c8}.num{display:block;color:#888177;font:31px Georgia,serif}.item.on .num,.item.on .name{color:#a44530}.name{display:block;margin-top:5px;color:#5f5b53;font-size:10px}.stage{display:flex;flex-direction:column;min-width:0}.tools{height:43px;display:flex;align-items:center;padding:0 20px;color:#777268;font-size:10px}.tools span:last-child{margin-left:auto;color:#a44530}.sheet{flex:1;margin:0 20px 18px;border:1px solid #c9c5bb;border-top:2px solid #a44530;background:#e8e5de;display:grid;place-items:center}.poster{width:68%;height:72%;padding:22px;background:#f9f8f4;border:1px solid #aaa49a;display:flex;flex-direction:column}.poster small{letter-spacing:2px;color:#777268}.poster h1{margin:18px 0 0;font:44px Georgia,serif;letter-spacing:-2px}.poster p{max-width:260px;color:#777268;line-height:1.7}.poster .line{margin-top:auto;width:45%;height:5px;background:#a44530}.approve{height:50px;display:flex;align-items:center;padding:0 20px;border-top:1px solid #c9c5bb;color:#777268}.approve b{margin-left:auto;color:#a44530;font-weight:400;border-bottom:1px solid #a44530;padding-bottom:4px}@media(max-width:600px){.room{grid-template-columns:78px 1fr}.index{padding:12px 8px}.num{font-size:25px}.poster{width:82%}.poster h1{font-size:30px}.doc{display:none}}</style></head><body><header class="head"><div class="brand">Design</div><div class="doc">/ 独立出版计划</div><div class="nav">校样　契约　评审</div></header><main class="room"><aside class="index"><div class="item on"><span class="num">01</span><span class="name">校样编辑</span></div><div class="item"><span class="num">02</span><span class="name">鲜色构成</span></div><div class="item"><span class="num">03</span><span class="name">精密仪器</span></div></aside><section class="stage"><div class="tools"><span>校样编辑</span><span>单幅　对照　资料</span></div><div class="sheet"><div class="poster"><small>FIELD NOTES · 2026</small><h1>把观察，<br>编成一页。</h1><p>独立出版物与创作者档案，以内容节奏而非装饰建立阅读起点。</p><div class="line"></div></div></div><div class="approve"><span>当前校样：校样编辑</span><b>选定此方向 →</b></div></section></main></body></html>
