<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Office Studio — open, create and revisit Office documents" />
  <title>Office Studio</title>
</head>
<style>
  body {
    --display-font: "Iowan Old Style", "Palatino Linotype", "Songti SC", "Noto Serif CJK SC", serif;
    height: 100%; min-height: 0; overflow: hidden; container-type: inline-size;
    font-size: clamp(11px, .9cqw, 13px);
  }
  button { font: inherit; }
  button:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 3px; }
  .home { height: 100%; min-height: 0; display: flex; flex-direction: column; }
  .homebar { flex: none; min-height: 56px; display: flex; align-items: center; gap: 18px; padding: 0 clamp(18px, 4cqw, 44px); border-bottom: 1px solid var(--border-color); }
  .brand { font-family: var(--display-font); font-size: clamp(20px, 2.1cqw, 26px); line-height: 1; font-weight: 500; letter-spacing: -.035em; }
  .actions { margin-left: auto; display: flex; align-items: center; gap: 20px; }
  .action { position: relative; min-height: 34px; display: inline-flex; align-items: center; gap: 7px; padding: 0; border: 0; background: transparent; color: var(--text-color-secondary); cursor: pointer; font-size: clamp(11px, .9cqw, 13px); white-space: nowrap; }
  .action:hover, .action.primary { color: var(--color-primary); }
  .action.primary { border-bottom: 1px solid var(--color-primary); }
  .content { flex: 1; min-height: 0; overflow: auto; }
  .shelf { width: min(1280px, 100%); box-sizing: border-box; margin: 0 auto; padding: 0 clamp(18px, 4cqw, 44px) 56px; }
  .group { margin-top: clamp(30px, 4cqw, 46px); }
  .section-head { min-height: 38px; display: flex; align-items: baseline; gap: 10px; }
  .section-title { font-family: var(--display-font); font-size: clamp(20px, 2cqw, 25px); font-weight: 500; letter-spacing: -.02em; }
  .count { color: var(--text-color-tertiary); font-family: var(--font-family-mono, monospace); font-size: 10px; }
  .text-btn { flex: none; padding: 4px 0; border: 0; background: transparent; color: var(--text-color-tertiary); cursor: pointer; font-size: var(--font-size-xs); }
  .section-head .text-btn { margin-left: auto; }
  .text-btn:hover { color: var(--color-primary); }
  .text-btn.confirm { color: var(--color-danger); }
  .rows { margin-top: 9px; border-top: 1px solid var(--border-color); }
  .row { display: grid; grid-template-columns: 50px minmax(0, 1fr) auto auto; gap: 14px; align-items: center; min-height: 68px; border-bottom: 1px solid var(--border-color); cursor: pointer; }
  .row:hover { border-bottom-color: var(--text-color-tertiary); }
  .row:hover .name { color: var(--color-primary); }
  .index { color: var(--text-color-tertiary); font-family: var(--display-font); font-size: clamp(18px, 1.8cqw, 23px); line-height: 1; font-variant-numeric: tabular-nums; }
  .meta { min-width: 0; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--display-font); font-size: clamp(18px, 1.7cqw, 22px); line-height: 1.25; font-weight: 500; letter-spacing: -.02em; }
  .path { margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-color-tertiary); font-family: var(--font-family-mono, monospace); font-size: 10px; }
  .kind { color: var(--text-color-tertiary); font-family: var(--font-family-mono, monospace); font-size: 10px; text-transform: uppercase; }
  .empty { padding: 24px 0; color: var(--text-color-tertiary); font-size: var(--font-size-sm); }
  .error { margin: 16px 0 0; padding-left: 12px; border-left: 2px solid var(--color-danger); color: var(--color-danger); font-size: var(--font-size-xs); white-space: pre-wrap; }
  @container (max-width: 720px) {
    .homebar { min-height: 52px; gap: 12px; }
    .actions { gap: 14px; }
    .row { grid-template-columns: 38px minmax(0, 1fr) auto; gap: 10px; min-height: 66px; }
    .kind { display: none; }
  }
  @container (max-width: 500px) {
    .homebar { flex-wrap: wrap; padding: 10px 16px; }
    .actions { width: 100%; margin-left: 0; justify-content: space-between; gap: 10px; }
    .brand { font-size: 22px; }
    .action { font-size: 11px; }
    .path { display: none; }
  }
</style>
<body>
  <main class="home">
    <header class="homebar">
      <div class="brand">Office Studio</div>
      <div class="actions">
        <button class="action" @click="onOpen">{{ $t('home.open') }}</button>
        <button class="action" @click="onNew('excel')">{{ $t('home.new_excel') }}</button>
        <button class="action primary" @click="onNew('word')">{{ $t('home.new_word') }} →</button>
      </div>
    </header>
    <div class="content"><div class="shelf">
      <div v-if="home_err" class="error" role="alert">{{ home_err }}</div>
      <section class="group">
        <div class="section-head">
          <span class="section-title">{{ $t('home.recent') }}</span>
          <span v-if="recent.length" class="count">{{ recent.length }}</span>
          <button v-if="recent.length" class="text-btn" :class="{confirm: pending_clear}" @click="onClear">{{ pending_clear ? $t('home.clear_confirm') : $t('home.clear') }}</button>
        </div>
        <div class="rows">
          <div v-if="!recent.length" class="empty">{{ $t('home.empty') }}</div>
          <div v-for="(r, index) in recent" class="row" @click="go(r.path)">
            <span class="index">{{ String(index + 1).padStart(2, '0') }}</span>
            <div class="meta"><div class="name">{{ r.name }}</div><div class="path">{{ displayPath(r.path) }}</div></div>
            <span class="kind">{{ r.kind }}</span>
            <button class="text-btn" @click.stop="onRemove(r.path)">{{ $t('common.remove') }}</button>
          </div>
        </div>
      </section>
    </div></div>
  </main>
</body>
<script setup>
  import {loadRecent, removeRecent, clearRecent, kindOf} from './recent.js'

  recent = loadRecent()
  home_err = ''
  pending_clear = false

  const errMsg = e => String((e && e.message) || e)
  displayPath = path => String(path || '').startsWith('/fs/') ? path : '/fs' + path
  go = path => {
    const page = kindOf(path) === 'word' ? 'word' : 'excel'
    $router.push(page + '?url=' + encodeURIComponent(path))
  }
  const startDir = () => {
    const first = (recent[0] && recent[0].path) || ''
    if (!first) return ''
    const seg = String(first).split('/').filter(Boolean)
    seg.pop()
    return seg.length ? '/' + seg.join('/') : ''
  }
  onOpen = async () => {
    try {
      home_err = ''
      const file = await $mod.$fs.pickFiles({accept: ['.xlsx', '.xls', '.docx', '.doc'], multiple: false})
      if (file) go(file.path)
    } catch (error) { home_err = $t('home.open_failed') + errMsg(error) }
  }
  onNew = async kind => {
    try {
      home_err = ''
      const isWord = kind === 'word'
      const file = await $mod.$fs.pickSavePath({
        name: isWord ? $t('home.untitled_word') : $t('home.untitled_excel'),
        ext: isWord ? '.docx' : '.xlsx',
        accept: [isWord ? '.docx' : '.xlsx'],
        start: startDir(),
      })
      if (!file) return
      $router.push((isWord ? 'word' : 'excel') + '?url=' + encodeURIComponent(file.path) + '&new=1')
    } catch (error) { home_err = $t('home.new_failed') + errMsg(error) }
  }
  onRemove = path => { removeRecent(path); recent = loadRecent() }
  onClear = () => {
    if (!pending_clear) { pending_clear = true; return }
    clearRecent()
    recent = []
    pending_clear = false
  }

  pageDesc = {
    desc: 'Office Studio 首页：统一打开/新建 xlsx、docx，展示共享最近打开历史',
    commands: [
      {name: 'status', desc: '首页状态（最近打开列表）', handler: async () => ({ok: true, recent: loadRecent().map(r => ({path: r.path, name: r.name, kind: r.kind}))})},
    ],
  }
</script>
</html>
