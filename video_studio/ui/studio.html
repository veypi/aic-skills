    } finally {
      exporting = false
      $refs.stage.$data.setExporting(false)
    }
  }

  // 导出文件扩展名（与格式对应）
  const exExt = (format) => format === 'wav' ? 'wav' : format === 'mp4' ? 'mp4' : 'webm'
  const downloadBlob = (blob, filename) => {
    const url = URL.createObjectURL(blob)
    const link = document.createElement('a')
    link.href = url
    link.download = filename
    link.style.display = 'none'
    document.body.appendChild(link)
    link.click()
    link.remove()
    setTimeout(() => URL.revokeObjectURL(url), 1000)
  }
  // 成品直接下载到浏览器，不占用存档所在的 $fs 位置
  startExport = async () => {
    if (!doc || exporting) return
    const {w, h} = exSize()
    const format = exFormat
    const fname = safeTitle() + '.' + exExt(format)
    try {
      $message.info($t('studio.export_started'))
      const blob = await doExport({format, width: w, height: h, fps: exFpsOf(), quality: exQuality})
      downloadBlob(blob, fname)
      $message.success($t('studio.export_done') + fname)
    } catch (e) {
      console.error(e)
      $message.error($t('studio.export_failed') + (e && e.message ? e.message : e))
    }
  }

</script>
<script active>
  initPage()
</script>
<script>
  $scope.addCleanup($router.onChange(() => {initPage()}))
  // 快捷键（焦点在输入控件时不生效；Cmd/Ctrl 组合键除外）
  $scope.addEventListener(window, 'keydown', (e) => {
    const t = e.target
    const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)
    const meta = e.metaKey || e.ctrlKey
    const k = e.key

    // ---- Cmd/Ctrl 组合：undo/redo + 剪贴板 ----
    if (meta && !typing) {
      const lk = k.toLowerCase()
      if (lk === 's') {
        e.preventDefault()
        if (e.shiftKey || !curPath) saveAsArchive().catch(error => $message.error($t('studio.save_as_failed') + String(error?.message || error)))
        else doSave().catch(error => $message.error($t('studio.save_failed') + String(error?.message || error)))
        return
      }
      if (lk === 'z') {e.preventDefault(); e.shiftKey ? redoEdit() : undoEdit(); return }
      if (lk === 'y') {e.preventDefault(); redoEdit(); return }
      if (lk === 'c') {copyElement(); return }
      if (lk === 'v') {pasteElement(); return }
      if (lk === 'd') {e.preventDefault(); if (sel.kind === 'element') dupElement(sel.elId); return }
    }
    if (typing) return

    const st = $refs.stage
    if (e.code === 'Space') {
      e.preventDefault()
      if (st && st.$data.doc) st.$data.togglePlay()
      return
    }
    if (e.key === 'Delete' || e.key === 'Backspace') {
      if (!doc || !curPath) return
      e.preventDefault()
      if (sel.kind === 'element') delElements(sel.elIds && sel.elIds.length ? sel.elIds : [sel.elId])
      else if (sel.kind === 'scene') delScene(sel.sceneIndex)
      return
    }
    if (e.key === 'Escape') {selNone(); return }

    // ---- 选中元素时方向键 = 微调（1px，Shift=10px）----
    if (sel.kind === 'element' && sel.elIds && sel.elIds.length && curPath &&
      (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
      e.preventDefault()
      const d = e.shiftKey ? 10 : 1
      nudgeSelected(
        e.key === 'ArrowLeft' ? -d : e.key === 'ArrowRight' ? d : 0,
        e.key === 'ArrowUp' ? -d : e.key === 'ArrowDown' ? d : 0,
      )
      return
    }

    // ---- 走带控制（Remotion 风格）----
    if (!st || !st.$data.doc || exporting) return
    const S = st.$data
    if (e.key === 'ArrowLeft') {e.preventDefault(); S.stepFrame(e.shiftKey ? -10 : -1)}
    else if (e.key === 'ArrowRight') {e.preventDefault(); S.stepFrame(e.shiftKey ? 10 : 1)}
    else if (e.key === 'Home') {e.preventDefault(); S.seekFrame(0)}
    else if (e.key === 'End') {e.preventDefault(); S.seekFrame(S.totalFrames - 1)}
    else if (e.key === 'ArrowUp') {e.preventDefault(); jumpScene(-1)}
    else if (e.key === 'ArrowDown') {e.preventDefault(); jumpScene(1)}
    else if (k === 'j' || k === 'J') {S.shuttle(-1)}
    else if (k === 'k' || k === 'K') {S.shuttle(0)}
    else if (k === 'l' || k === 'L') {S.shuttle(1)}
  })
</script>

</html>
