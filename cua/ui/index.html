<!DOCTYPE html>
<html>

<head>
  <meta name="description" content="CUA Status & Permission Diagnostics"
    details="CuaDriver permission diagnostics on the selected device.">
  <title>{{$t('cua.title')}}</title>
</head>
<style>
  body {
    width: 100%;
    padding: var(--spacing-lg);
    background: var(--bg-color);
    color: var(--text-color);
  }

  .cua-page {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: var(--spacing-lg);
  }

  .cua-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--spacing-md);
    flex-wrap: wrap;
  }

  .cua-head h2 {
    margin: 0;
    font-size: var(--font-size-xl);
  }

  .cua-card {
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    background: var(--bg-color-secondary);
    padding: var(--spacing-lg);
    display: flex;
    flex-direction: column;
    gap: var(--spacing-sm);
  }

  .cua-row {
    display: flex;
    gap: var(--spacing-sm);
    align-items: baseline;
    font-size: var(--font-size-sm);
  }

  .cua-row .k {
    color: var(--text-color-secondary);
    min-width: 96px;
    flex-shrink: 0;
  }

  .cua-row .v {
    word-break: break-all;
    font-family: var(--font-mono);
  }

  .guide li {
    margin: 6px 0;
    line-height: 1.6;
    font-size: var(--font-size-sm);
  }

  .guide code {
    font-family: var(--font-mono);
    background: var(--bg-color-hover, rgba(0, 0, 0, 0.06));
    padding: 1px 6px;
    border-radius: var(--radius-sm);
  }
</style>

<body>
  <div class="cua-page">
    <div class="cua-head">
      <h2>{{$t('cua.title')}}</h2>
      <div style="display:flex; gap:8px; align-items:center">
        <select v:value="selectedHostId" @change="refresh" :disabled="loading" :aria-label="$t('cua.device')">
          <option value="" disabled>{{$t('cua.device')}}</option>
          <option v-for="d in devices" :value="d.id">{{d.name}}</option>
        </select>
        <button class="btn-ghost" @click="refresh" :disabled="loading" :title="$t('cua.refresh')">
          <i class="fa-solid fa-arrows-rotate" :class="{'fa-spin': loading}"></i>
        </button>
      </div>
    </div>

    <div class="cua-card" v-if="error" role="alert">{{error}}</div>
    <div class="cua-card" v-if="status">
      <strong>{{$t('cua.state')}}</strong>
      <pre style="white-space:pre-wrap;overflow-wrap:anywhere;margin:0">{{status}}</pre>
    </div>

    <div class="cua-card guide">
      <strong>{{$t('cua.guide_title')}}</strong>
      <ol style="margin:0; padding-left: 20px">
        <li>{{$t('cua.guide_step1')}}</li>
        <li>{{$t('cua.guide_step2')}}</li>
        <li v-html="$t('cua.guide_step3')"></li>
        <li v-html="$t('cua.guide_step4')"></li>
      </ol>
    </div>
  </div>
</body>
<script setup>
  devices = []
  selectedHostId = ''
  status = null
  error = ''
  loading = false
  let connection = null
  let connectedHostId = ''
  let disposed = false

  cuaCall = async (name, args = {}) => {
    if (!/^[a-zA-Z0-9_.-]+$/.test(name)) throw new Error('Invalid CUA command')
    const out = await connection.execCall(`mcp call cua ${name} --input - --json`, {stdin: JSON.stringify(args)})
    if (!out.content) throw new Error(out.attrs?.stderr || 'CUA command returned no result')
    const result = JSON.parse(out.content)
    if (result.isError || out.attrs?.exit_code !== '0') throw new Error(result.content?.filter(c => c.type === 'text').map(c => c.text).join('\n') || out.attrs?.stderr || 'CUA command failed')
    return result
  }

  refresh = async () => {
    if (!selectedHostId || loading) return
    loading = true
    error = ''
    status = null
    try {
      if (connection && connectedHostId !== selectedHostId) { await connection.close(); connection = null }
      if (!connection || connection.closed) {
        connectedHostId = selectedHostId
        connection = await $hosts.openTools(connectedHostId)
      }
      if (disposed) { await connection.close(); connection = null; return }
      const result = await cuaCall('check_permissions')
      if (disposed || connectedHostId !== selectedHostId) return
      status = result.structuredContent ? JSON.stringify(result.structuredContent, null, 2) : result.content?.filter(c => c.type === 'text').map(c => c.text).join('\n') || JSON.stringify(result, null, 2)
    } catch (e) {
      error = e.message
      status = null
      await connection?.close().catch(() => {})
      connection = null
    }
    loading = false
  }

  mount = async () => {
    const hosts = (await $hosts.directory.list()).filter(h => h.status === 'enabled')
    devices = hosts.map(h => ({id: h.id, name: h.name || h.hostname || h.id}))
    if (disposed) return
    selectedHostId = devices[0]?.id || ''
    if (selectedHostId) refresh()
  }
  unmount = () => {
    disposed = true
    connection?.close().catch(() => {})
    connection = null
  }
</script>
<script>mount()</script>
<script dispose>unmount()</script>

</html>
