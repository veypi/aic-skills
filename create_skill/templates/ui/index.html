<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <meta name="description" content="my_tool"
    details="Minimal skill ui page template: vhtml script setup + $fetch calling package api (api/list, api/add). Replace contents with your own.">
  <title>my_tool</title>
</head>
<style>
  /* 样式规范：页面底色/字体由 OS 统一提供（body 只写布局）；颜色用平台设计 token——见 create_skill references/page-ui-manual.md §6 */
  body {
    height: 100%; padding: 16px; box-sizing: border-box;
    display: flex; flex-direction: column;
    container-type: inline-size; /* 窗口 ≠ 视口：用 @container，不要用 @media */
  }

  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  .row input { padding: 6px 10px; border-radius: var(--radius-lg); border: 1px solid var(--border-color); background: var(--bg-color-secondary); color: var(--text-color); }
  .row button { padding: 6px 14px; border-radius: var(--radius-lg); border: 1px solid var(--border-color); background: var(--bg-color-tertiary); color: var(--text-color); cursor: pointer; transition: border-color var(--transition-fast); }
  .row button:hover { border-color: var(--border-color-hover); }

  .item { padding: 6px 0; border-bottom: 1px solid var(--border-color); }
  .err { color: var(--color-danger); }
  .empty { color: var(--text-color-secondary); }

  @container (max-width: 420px) {
    .row { flex-wrap: wrap; }
  }
</style>

<body>
  <h3>my_tool</h3>
  <div class="row">
    <input v:value="title" placeholder="title" />
    <input v:value="qty" type="number" placeholder="qty" style="width:80px" />
    <button @click="add">add</button>
    <button @click="load">refresh</button>
  </div>
  <div v-if="error" class="err">{{error}}</div>
  <div v-for="it in items" class="item">{{it.title}} × {{it.qty}}</div>
  <div v-if="!items.length" class="empty">暂无数据</div>
</body>
<script setup>
  // 包页面由平台固定 env.js 完成引导：$fetch（模块本地）、$t、$message 等直接可用。
  // 包内 api 用相对地址（api/{name}）——相对包服务前缀解析，与部署 id 无关。
  // 注意：vhtml 双向绑定是 `v:value`（没有 `v-model` / `v-model.number`）；
  //       数字输入框拿到的是字符串，提交前自行 Number() 转换。
  items = []
  title = ''
  qty = 1
  error = ''

  load = async () => {
    error = ''
    try {
      const r = await $fetch('api/list')
      items = r.rows || []
    } catch (e) { error = e.message }
  }
  add = async () => {
    error = ''
    try {
      await $fetch('api/add', { method: 'POST', body: { title: title, qty: Number(qty) || 1 } })
      title = ''
      await load()
    } catch (e) { error = e.message }
  }
  mount = () => load()
</script>
<script>mount()</script>

</html>
