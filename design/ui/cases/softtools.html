<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>柔和工具</title><style>html,body{width:100%;height:100%;overflow:hidden}*{box-sizing:border-box}body{margin:0;background:#e8ede7;color:#29362f;font:13px Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.app{width:min(360px,92vw);padding:24px 24px 20px;border-radius:28px;background:#f8faf6;box-shadow:0 18px 60px #52634f1c}.top{display:flex;align-items:center;color:#77857a}.top b{color:#34473b;font-size:16px}.top span:last-child{margin-left:auto}.intro{margin-top:30px;text-align:center}.intro small{color:#77857a;letter-spacing:2px}.intro h1{margin:9px 0 0;font-size:28px;font-weight:500;letter-spacing:-1px}.breath{position:relative;width:210px;height:210px;margin:30px auto 24px;display:grid;place-items:center;border-radius:50%;background:#d8e4d6}.breath:before{content:'';position:absolute;inset:20px;border-radius:50%;background:#b7ceb4}.breath:after{content:'';position:absolute;inset:48px;border-radius:50%;background:#789578}.breath span{position:relative;z-index:2;color:white;font-size:19px}.breath small{position:absolute;z-index:2;margin-top:55px;color:#edf4ea}.action{width:100%;height:48px;border:0;border-radius:24px;background:#466552;color:#fff;font-size:15px}.meta{display:flex;justify-content:center;gap:28px;margin-top:22px;color:#77857a}.meta b{color:#34473b;font-weight:500}.note{margin:22px 0 0;padding-top:16px;border-top:1px solid #dfe6dd;text-align:center;color:#77857a;font-size:11px;line-height:1.6}@media(max-height:650px){.app{padding:18px 24px}.intro{margin-top:18px}.breath{width:160px;height:160px;margin:20px auto}.breath:after{inset:42px}}</style></head><body><main class="app"><div class="top"><b>片刻</b><span>今天，留三分钟给自己</span><span>•••</span></div><div class="intro"><small>THREE MINUTES</small><h1>跟随自己的呼吸</h1></div><div class="breath"><span>吸气</span><small>04.0 秒</small></div><button class="action">开始三分钟练习</button><div class="meta"><span><b>3 分钟</b><br>本轮时长</span><span><b>自由节奏</b><br>不计连续打卡</span></div><p class="note">音频不可用，将以静音模式继续。<br>你可以随时暂停，不需要完成任何目标。</p></main></body></html>
